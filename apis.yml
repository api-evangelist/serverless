aid: serverless
name: Serverless
description: >-
  Serverless, Inc. builds the Serverless Framework, the original and most widely
  adopted open-source tool for building, deploying and operating serverless
  applications on AWS Lambda and other managed cloud services. It pairs a
  YAML-configured, multi-language command-line interface with a Dashboard for
  monitoring and CI/CD, a large plugin ecosystem, and an MCP server that gives
  AI assistants access to infrastructure metrics, configuration and logs across
  Serverless Framework, AWS CloudFormation and SAM stacks. The company is based
  in San Francisco and backed by Lightspeed Venture Partners and Trinity Ventures.
